<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nrmt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0b;
    --paper:#e8e6e1;
    --dim:#7b7a78;
    --gold:#c9a227;
    --measure:33em;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    font-weight:300;
    font-size:17px;
    line-height:2.1;
    letter-spacing:.02em;
    padding:0 1.5rem 8rem;
  }

  .wrap{max-width:var(--measure);margin:0 auto;}

  /* ── 抬頭 ───────────────── */
  header{
    padding:6rem 0 0;
    text-align:center;
  }
  h1{
    font-family:"Cormorant Garamond",serif;
    font-weight:300;
    font-size:2.6rem;
    letter-spacing:.28em;
    margin:0;
    text-indent:.28em;
    color:var(--paper);
  }
  .sub{
    margin:1.3rem 0 0;
    font-size:.9rem;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--dim);
  }
  .rule{
    width:2.2rem;height:1px;background:var(--dim);
    border:0;margin:2.8rem auto 0;opacity:.55;
  }

  /* ── 作品列表 ───────────────── */
  ul.works{list-style:none;padding:0;margin:4.4rem 0 0;}
  ul.works li{margin:0 0 2.9rem;}

  a.work{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:.2rem 0;
    transition:opacity .25s ease;
  }
  a.work:hover .t,a.work:focus-visible .t{color:var(--gold);}
  a.work:focus-visible{outline:1px solid var(--dim);outline-offset:8px;}

  .t{
    font-size:1.35rem;
    font-weight:400;
    letter-spacing:.06em;
    color:var(--paper);
    transition:color .25s ease;
  }
  .meta{
    margin:.35rem 0 0;
    font-family:"Cormorant Garamond",serif;
    font-style:italic;
    font-size:.95rem;
    letter-spacing:.06em;
    color:var(--dim);
  }

  footer{
    margin:5.5rem 0 0;
    text-align:center;
    font-family:"Cormorant Garamond",serif;
    font-style:italic;
    font-size:.9rem;
    letter-spacing:.08em;
    color:var(--dim);
  }

  @media (max-width:480px){
    body{font-size:16px;}
    header{padding:4.5rem 0 0;}
    h1{font-size:2.1rem;letter-spacing:.2em;}
    .t{font-size:1.2rem;}
  }

  @media (prefers-reduced-motion:no-preference){
    .wrap{animation:fade 1.1s ease both;}
    @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>nrmt</h1>
    <p class="sub">成歩堂龍一 &times; 御剣怜侍</p>
    <hr class="rule">
  </header>

  <ul class="works">

    <li>
      <a class="work" href="hoshi-wo-mini-ikou.html">
        <div class="t">星を見に行こう</div>
        <p class="meta">Phoenix &times; Miles &middot; 童年</p>
      </a>
    </li>

    <li>
      <a class="work" href="lucid-dream.html">
        <div class="t">Lucid Dream</div>
        <p class="meta">成中心 &middot; 夢境</p>
      </a>
    </li>

  </ul>

  <footer>&mdash; yko &mdash;</footer>

</div>
</body>
</html>
